<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>لوحة تحكم الكوبونات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=4">
<style>
  body.admin{--a-bg:#f4f5f7;--a-card:#fff;--a-ink:#111827;--a-mut:#6b7280;--a-line:#e5e7eb;--a-pri:#111827;
    background:var(--a-bg);color:var(--a-ink);font-family:'Tajawal',system-ui,sans-serif}
  @media (prefers-color-scheme:dark){body.admin{--a-bg:#0b0d10;--a-card:#15181d;--a-ink:#f3f4f6;--a-mut:#9ca3af;--a-line:#262a31;--a-pri:#f3f4f6}}
  .admin *{font-family:inherit}
  .login{max-width:360px;margin:12vh auto;padding:0 20px;text-align:center}
  .login h1{font-size:26px;margin:0 0 6px}.login p{color:var(--a-mut);margin:0 0 22px}
  .a-in,.a-sel,.a-ta{width:100%;border:1.5px solid var(--a-line);background:var(--a-card);color:var(--a-ink);border-radius:12px;padding:12px 14px;font-size:15px;outline:none}
  .a-in:focus,.a-sel:focus,.a-ta:focus{border-color:var(--a-pri)}
  .a-ta{min-height:92px;resize:vertical;line-height:1.7}
  .a-btn{border:0;background:var(--a-pri);color:var(--a-bg);padding:12px 18px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
  .a-btn.ghost{background:transparent;color:var(--a-ink);border:1.5px solid var(--a-line)}
  .a-btn.danger{background:#dc2626;color:#fff}
  .a-btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
  .a-btn:disabled{opacity:.5}
  .top{position:sticky;top:0;z-index:20;background:var(--a-bg);padding:12px 14px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--a-line)}
  .top .a-sel{flex:1;font-weight:700}
  .tabs{display:flex;gap:6px;padding:10px 14px 0;overflow-x:auto}
  .tab{flex:1;white-space:nowrap;border:0;background:transparent;color:var(--a-mut);padding:10px 12px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
  .tab.on{background:var(--a-card);color:var(--a-ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  main.a-main{max-width:980px;margin:0 auto;padding:14px}
  .card{background:var(--a-card);border:1px solid var(--a-line);border-radius:18px;padding:18px;margin-bottom:14px}
  .card h3{margin:0 0 10px;font-size:17px}
  .hint{color:var(--a-mut);font-size:13.5px;line-height:1.7;margin:4px 0 0}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:560px){.grid4{grid-template-columns:1fr 1fr}.grid2.keep{grid-template-columns:1fr 1fr}.grid2:not(.keep){grid-template-columns:1fr}}
  .kpi{background:var(--a-bg);border-radius:14px;padding:14px;text-align:center}.kpi b{display:block;font-size:26px}.kpi small{color:var(--a-mut)}
  .ringwrap{display:flex;align-items:center;gap:18px}
  .ring{position:relative;width:128px;height:128px;flex:none}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;font-size:22px;line-height:1.1}
  .ring small{display:block;font-size:12px;color:var(--a-mut);font-weight:500}
  label.f{display:block;font-size:13.5px;font-weight:700;margin:12px 0 6px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1.5px solid var(--a-line);background:var(--a-card);border-radius:99px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--a-ink)}
  .sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--a-card);box-shadow:0 0 0 1.5px var(--a-line);cursor:pointer;padding:0}
  .sw.emo{font-size:18px;display:grid;place-items:center;background:var(--a-card)}
  input[type=color]{width:100%;height:44px;border:1.5px solid var(--a-line);border-radius:12px;background:var(--a-card);padding:4px}
  .edit-grid{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:860px){.edit-grid{grid-template-columns:1fr 400px;align-items:start}.pv-col{position:sticky;top:130px}}
  .pv{border-radius:20px;border:1px solid var(--a-line);padding:18px 14px 22px;max-height:78vh;overflow:auto}
  .pv .wrap{padding:0}
  .crow{border-bottom:1px solid var(--a-line);padding:12px 0}.crow:last-child{border:0}
  .cmain{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .cmain .num{color:var(--a-mut);font-size:13px}
  .cmain code{font-family:ui-monospace,Menlo,monospace;font-size:14px;direction:ltr;letter-spacing:.5px;font-weight:700}
  .badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
  .b-new{background:#dcfce7;color:#166534}.b-used{background:#dbeafe;color:#1e40af}.b-exp{background:#fef3c7;color:#92400e}.b-rep{background:#e5e7eb;color:#4b5563}
  .crow.replaced{opacity:.6}
  .chip.on{background:var(--a-pri);color:var(--a-bg);border-color:var(--a-pri)}
  .clabel{color:var(--a-mut);font-size:13.5px;margin:4px 0 8px}
  .cact{display:flex;gap:6px;flex-wrap:wrap}
  .empty{text-align:center;color:var(--a-mut);padding:40px 10px}
  .switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:700}
  .switch input{width:20px;height:20px}
  .logo-prev{width:56px;height:56px;border-radius:50%;object-fit:cover;border:1px solid var(--a-line);background:#fff}
  .warn{background:#fef3c7;color:#92400e;border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px}
  a.lnk{color:var(--a-ink);font-weight:700}
</style>
</head>
<body class="admin">

<div id="login" class="login" hidden>
  <h1>🎟️ لوحة التحكم</h1>
  <p>أدخل كلمة سر الأدمن للمتابعة</p>
  <input class="a-in" id="keyIn" type="password" placeholder="كلمة السر" autocomplete="current-password">
  <button class="a-btn" id="loginBtn" style="width:100%;margin-top:12px">دخول</button>
  <div id="loginMsg" class="hint" style="color:#dc2626;min-height:22px;margin-top:10px"></div>
</div>

<div id="app" hidden>
  <div class="top">
    <select class="a-sel" id="campSel"></select>
    <button class="a-btn sm" id="newBtn">+ حملة</button>
    <button class="a-btn ghost sm" id="outBtn">خروج</button>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab" data-tab="overview">نظرة عامة</button>
    <button class="tab" data-tab="coupons">الكوبونات</button>
    <button class="tab" data-tab="settings">التصميم والإعدادات</button>
  </nav>
  <main class="a-main" id="view"></main>
</div>
<div id="toast"></div>

<script src="qr.js?v=4"></script>
<script src="config.js?v=4"></script>
<script src="shared.js?v=4"></script>
<script>
(function () {
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = App.esc;
  const BASE = App.CFG.PUBLIC_BASE_URL || new URL('./', location.href).href;

  let KEY = ''; try { KEY = sessionStorage.getItem('ak') || ''; } catch (e) {}
  let camps = [], curId = null, coupons = [], tab = 'overview', filter = 'all', draft = null, pvState = 'valid';
  const riyadhDate = (offsetDays) => new Date(Date.now() + (offsetDays || 0) * 864e5).toLocaleDateString('en-CA', { timeZone: 'Asia/Riyadh' });
  const endOfDayISO = d => d ? new Date(d + 'T23:59:59+03:00').toISOString() : null;
  let genDate = riyadhDate(30);   // صلاحية الدفعة القادمة (فاضي = بدون انتهاء)

  const ERRS = { unauthorized: 'كلمة السر غير صحيحة (أو لم تغيّرها في schema.sql)', slug_taken: 'هذا الاسم المختصر مستخدم، غيّره',
    not_configured: 'أكمل ملف config.js أولاً', network: 'تعذّر الاتصال بالإنترنت', bad_count: 'العدد بين 1 و 1000',
    bad_expiry: 'تاريخ الصلاحية لازم يكون في المستقبل' };
  const errText = e => ERRS[e.message] || e.message || 'حدث خطأ';
  const api = (fn, a) => App.rpc(fn, Object.assign({ p_key: KEY }, a || {}));
  const cur = () => camps.find(c => c.id === curId) || null;
  const toast = App.toast;

  /* ---------- الدخول ---------- */
  async function boot() {
    if (!KEY) return showLogin();
    try { await loadCamps(); showApp(); }
    catch (e) { KEY = ''; showLogin(errText(e)); }
  }
  function showLogin(msg) {
    $('#app').hidden = true; $('#login').hidden = false; $('#loginMsg').textContent = msg || '';
  }
  $('#loginBtn').onclick = async () => {
    KEY = $('#keyIn').value.trim();
    if (!KEY) return;
    try { await loadCamps(); try { sessionStorage.setItem('ak', KEY); } catch (e) {} showApp(); }
    catch (e) { KEY = ''; $('#loginMsg').textContent = errText(e); }
  };
  $('#keyIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('#loginBtn').click(); });
  $('#outBtn').onclick = () => { try { sessionStorage.removeItem('ak'); } catch (e) {} KEY = ''; showLogin(); };

  async function loadCamps(selectId) {
    camps = await api('admin_campaigns');
    if (selectId) curId = selectId;
    if (!camps.find(c => c.id === curId)) curId = camps[0] ? camps[0].id : null;
  }
  function showApp() {
    $('#login').hidden = true; $('#app').hidden = false;
    if (!cur()) { startNew(); } else { tab = tab === 'settings' && !draft ? 'overview' : tab; }
    render();
  }

  /* ---------- الحملات ---------- */
  const rnd = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => 'abcdefghjkmnpqrstuvwxyz23456789'[b % 31]).join('');
  const rndPin = () => String(100000 + (crypto.getRandomValues(new Uint32Array(1))[0] % 900000));
  function startNew() {
    curId = null; tab = 'settings';
    draft = { id: null, slug: 'promo-' + rnd(5), name: 'حملة جديدة', active: true, max: 100, pin: rndPin(),
      theme: JSON.parse(JSON.stringify(App.DEFAULT_THEME)) };
  }
  function draftFrom(c) {
    return { id: c.id, slug: c.slug, name: c.name, active: c.active, max: c.max, pin: c.pin,
      theme: Object.assign({}, App.DEFAULT_THEME, c.theme || {}) };
  }
  $('#newBtn').onclick = () => { startNew(); render(); };
  $('#campSel').onchange = async e => {
    if (e.target.value === '__new') { startNew(); return render(); }
    curId = e.target.value; draft = null; coupons = []; tab = tab === 'settings' ? 'settings' : tab;
    if (tab === 'settings') draft = draftFrom(cur());
    render();
  };
  $('#tabs').onclick = e => {
    const b = e.target.closest('[data-tab]'); if (!b) return;
    tab = b.dataset.tab;
    if (tab === 'settings' && cur() && (!draft || draft.id !== curId)) draft = draftFrom(cur());
    render();
  };

  /* ---------- العرض ---------- */
  function render() {
    const sel = $('#campSel');
    sel.innerHTML = camps.map(c => '<option value="' + c.id + '"' + (c.id === curId ? ' selected' : '') + '>' +
      esc(c.name) + (c.active ? '' : ' (متوقفة)') + '</option>').join('') +
      (curId ? '' : '<option value="__new" selected>حملة جديدة…</option>');
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === tab));
    if (!cur() && tab !== 'settings') { startNew(); }
    if (tab === 'overview') viewOverview();
    else if (tab === 'coupons') viewCoupons();
    else viewSettings();
  }

  /* ----- نظرة عامة ----- */
  function viewOverview() {
    const c = cur(); if (!c) return;
    const pct = Math.min(100, c.redeemed / c.max * 100), C = 2 * Math.PI * 54;
    const left = Math.max(0, c.max - c.redeemed);
    const reportUrl = BASE + 'report.html?s=' + c.slug;
    let notes = '';
    if (c.redeemed >= c.max) notes += '<div class="warn">✅ وصلنا للحد الأقصى (' + c.max + '). أي كوبون جديد سيُرفض تلقائياً.</div>';
    else {
      if (c.expired > 0) notes += '<div class="warn">⏳ عندك <b>' + c.expired + '</b> كوبون انتهت صلاحيته ولم يُستخدم. <a href="#" class="lnk" id="goExp">استبدلها الآن</a></div>';
      if (c.available < left) notes += '<div class="warn">⚠️ الكوبونات المتاحة (' + c.available + ') أقل من المتبقي من الحد (' + left + '). ولّد أو استبدل عشان توصل للعدد.</div>';
    }
    $('#view').innerHTML =
      notes +
      '<div class="card"><div class="ringwrap"><div class="ring"><svg viewBox="0 0 128 128"><circle cx="64" cy="64" r="54" fill="none" stroke="var(--a-line)" stroke-width="12"/>' +
      '<circle cx="64" cy="64" r="54" fill="none" stroke="' + esc(c.theme.color || '#7c4a21') + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - pct / 100)) + '"/></svg>' +
      '<div class="t"><div>' + c.redeemed + '<small>من ' + c.max + '</small></div></div></div>' +
      '<div><h3 style="margin:0 0 4px">' + esc(c.name) + '</h3><div class="hint">' + (c.active ? 'العرض فعّال' : 'العرض متوقف') + ' · المتبقي من الحد: <b>' + left + '</b></div></div></div></div>' +
      '<div class="grid4"><div class="kpi"><b>' + c.issued + '</b><small>مُصدرة</small></div><div class="kpi"><b>' + c.redeemed + '</b><small>تم استخدامها</small></div>' +
      '<div class="kpi"><b>' + c.available + '</b><small>متاحة (صالحة)</small></div><div class="kpi"><b>' + c.expired + '</b><small>منتهية تحتاج بدل</small></div></div>' +
      '<div class="card" style="margin-top:14px"><h3>📊 تقرير المحل</h3>' +
      '<p class="hint">الرابط يعرض لصاحب المحل عدد العملاء اللي خدمهم فعلياً فقط (بدون الحد ولا المتبقي ولا عدد المُصدر). أعطه الرابط مع الرمز السري.</p>' +
      '<div class="row" style="margin-top:10px"><input class="a-in" readonly value="' + esc(reportUrl) + '" style="flex:1;min-width:200px;direction:ltr">' +
      '<button class="a-btn sm" id="cpRep">نسخ</button></div>' +
      '<div class="hint" style="margin-top:10px">الرمز السري للكاشير: <b style="font-size:17px;letter-spacing:2px">' + esc(c.pin) + '</b></div></div>';
    $('#cpRep').onclick = () => copy(reportUrl);
    const g = $('#goExp'); if (g) g.onclick = e => { e.preventDefault(); filter = 'expired'; tab = 'coupons'; render(); };
  }

  /* ----- الكوبونات ----- */
  async function loadCoupons() {
    const c = cur(); if (!c) return;
    try { coupons = await api('admin_coupons', { p_campaign: c.id }); } catch (e) { toast(errText(e)); }
  }
  async function viewCoupons() {
    const c = cur(); if (!c) return;
    $('#view').innerHTML = '<div class="empty">جارٍ التحميل…</div>';
    await loadCoupons();
    drawCoupons();
  }
  const link = code => App.couponLink(code, BASE);
  // الحالة: used | avail | expired (تحتاج بدل) | replaced
  function stat(k) {
    if (k.redeemed_at) return 'used';
    if (k.expires_at && new Date(k.expires_at) < new Date()) return k.replaced_by ? 'replaced' : 'expired';
    return 'avail';
  }
  const FLT = [['all', 'الكل'], ['avail', 'متاح'], ['used', 'مستخدم'], ['expired', 'منتهي'], ['replaced', 'تم استبداله']];
  const filtered = () => coupons.filter(k => filter === 'all' || stat(k) === filter);
  function badge(k) {
    const s = stat(k);
    if (s === 'used') return '<span class="badge b-used">مستخدم · ' + esc(App.fmtDateTime(k.redeemed_at)) + '</span>';
    if (s === 'avail') return '<span class="badge b-new">متاح · ' + (k.expires_at ? 'حتى ' + esc(App.fmtDate(k.expires_at)) : 'بدون انتهاء') + '</span>';
    if (s === 'expired') return '<span class="badge b-exp">منتهي · ' + esc(App.fmtDate(k.expires_at)) + '</span>';
    const rep = coupons.find(x => x.code === k.replaced_by);
    return '<span class="badge b-rep">منتهي · استُبدل' + (rep ? ' بـ #' + rep.n : '') + '</span>';
  }
  function validityPicker() {
    return '<div class="chips" style="margin:10px 0 8px">' +
      [7, 14, 30, 60, 90].map(d => '<button type="button" class="chip" data-days="' + d + '">' + d + ' يوم</button>').join('') +
      '<button type="button" class="chip" data-days="0">بدون انتهاء</button></div>' +
      '<div class="row"><label class="f" style="margin:0">تنتهي يوم</label><input class="a-in" id="genExp" type="date" value="' + esc(genDate) + '" min="' + riyadhDate(1) + '" style="width:auto">' +
      '<span class="hint" id="genExpTxt"></span></div>';
  }
  function drawCoupons() {
    const c = cur(); if (!c) return;
    const counts = {}; coupons.forEach(k => { const s = stat(k); counts[s] = (counts[s] || 0) + 1; counts.all = (counts.all || 0) + 1; });
    const list = filtered();
    const nExp = counts.expired || 0;
    const rows = list.map(k => {
      const s = stat(k);
      return '<div class="crow ' + s + '"><div class="cmain"><span class="num">#' + k.n + '</span><code>' + esc(App.fmtCode(k.code)) + '</code>' + badge(k) + '</div>' +
        '<div class="clabel">' + (k.label ? esc(k.label) : '<i>بدون ملاحظة (جوال العميل أو رقم الفاتورة)</i>') + '</div>' +
        '<div class="cact" data-code="' + k.code + '">' +
        (s === 'avail' ? '<button class="a-btn sm" data-act="wa">واتساب</button><button class="a-btn ghost sm" data-act="copy">نسخ الرابط</button>' +
          '<button class="a-btn ghost sm" data-act="qr">QR</button><button class="a-btn ghost sm" data-act="open">فتح</button>' : '') +
        (s === 'expired' ? '<button class="a-btn sm" data-act="rep">🔄 استبدال</button>' : '') +
        '<button class="a-btn ghost sm" data-act="label">✏️</button>' +
        (s === 'used' ? '<button class="a-btn ghost sm" data-act="undo">↩ تراجع</button>' : '') +
        '</div></div>';
    }).join('');
    $('#view').innerHTML =
      '<div class="card"><h3>توليد كوبونات جديدة</h3>' +
      '<p class="hint">الحد الأقصى للاستخدام <b>' + c.max + '</b>. وزّع أكثر منه إن حبيت (مثلاً ' + Math.round(c.max * 1.3) + ')، النظام يوقف تلقائياً عند الحد. كل كود فريد ولا يتكرر أبداً.</p>' +
      '<label class="f">صلاحية هذه الدفعة</label>' + validityPicker() +
      '<div class="row" style="margin-top:14px"><input class="a-in" id="genN" type="number" min="1" max="1000" value="10" style="width:110px">' +
      '<button class="a-btn" id="genBtn">توليد</button></div></div>' +
      '<div class="card"><div class="chips" id="flts">' +
      FLT.map(f => '<button type="button" class="chip' + (filter === f[0] ? ' on' : '') + '" data-flt="' + f[0] + '">' + f[1] + ' (' + (counts[f[0]] || 0) + ')</button>').join('') + '</div>' +
      (nExp ? '<div class="warn" style="margin-top:12px">⏳ ' + nExp + ' كوبون منتهي لم يُستخدم. <button class="a-btn sm" id="repAll" style="margin-inline-start:8px">استبدال الكل</button><div class="hint" style="margin-top:6px">البدائل تُصدر بالصلاحية المحددة فوق ' + (genDate ? '(حتى ' + esc(App.fmtDate(genDate + 'T12:00:00+03:00')) + ')' : '(بدون انتهاء)') + ' وتحمل نفس الملاحظة.</div></div>' : '') +
      '<div class="row" style="margin-top:12px;justify-content:flex-end"><button class="a-btn ghost sm" id="csvBtn">CSV</button><button class="a-btn ghost sm" id="zipBtn">تنزيل الأكواد (ZIP)</button></div>' +
      '<div style="margin-top:8px">' + (rows || '<div class="empty">لا توجد كوبونات في هذه القائمة</div>') + '</div></div>';
    $('#genBtn').onclick = generate;
    $('#flts').onclick = e => { const b = e.target.closest('[data-flt]'); if (b) { filter = b.dataset.flt; drawCoupons(); } };
    $('#csvBtn').onclick = exportCsv;
    $('#zipBtn').onclick = exportZip;
    const ra = $('#repAll'); if (ra) ra.onclick = () => replaceExpired(null);
    const ge = $('#genExp');
    const sync = () => { genDate = ge.value; $('#genExpTxt').textContent = genDate ? '' : 'بدون انتهاء'; document.querySelectorAll('[data-days]').forEach(b => b.classList.toggle('on', (+b.dataset.days === 0 ? !genDate : genDate === riyadhDate(+b.dataset.days)))); };
    ge.onchange = sync;
    document.querySelectorAll('[data-days]').forEach(b => b.onclick = () => { const d = +b.dataset.days; ge.value = d ? riyadhDate(d) : ''; sync(); });
    sync();
  }
  $('#view').addEventListener('click', async e => {
    const b = e.target.closest('[data-act]'); if (!b || tab !== 'coupons') return;
    const code = b.parentElement.dataset.code, k = coupons.find(x => x.code === code), a = b.dataset.act;
    if (a === 'copy') copy(link(code));
    else if (a === 'open') window.open(link(code), '_blank');
    else if (a === 'wa') shareWa(k);
    else if (a === 'qr') downloadOne(k);
    else if (a === 'rep') replaceExpired(code);
    else if (a === 'label') {
      const v = prompt('ملاحظة (جوال العميل أو رقم الفاتورة):', k.label || '');
      if (v === null) return;
      try { await api('admin_set_label', { p_code: code, p_label: v }); k.label = v.trim() || null; drawCoupons(); } catch (er) { toast(errText(er)); }
    } else if (a === 'undo') {
      if (!confirm('إلغاء استخدام هذا الكوبون وإرجاعه صالحاً؟')) return;
      try { await api('admin_unredeem', { p_code: code }); await loadCamps(); await loadCoupons(); drawCoupons(); toast('تم التراجع'); } catch (er) { toast(errText(er)); }
    }
  });
  async function generate() {
    const n = parseInt($('#genN').value, 10), btn = $('#genBtn');
    if (!n || n < 1) return;
    btn.disabled = true;
    try {
      await api('admin_generate', { p_campaign: curId, p_count: n, p_expires: endOfDayISO(genDate) });
      await loadCamps(); await loadCoupons(); filter = 'avail'; drawCoupons();
      toast('تم توليد ' + n + ' كوبون' + (genDate ? ' صالحة حتى ' + App.fmtDate(genDate + 'T12:00:00+03:00') : ''));
    } catch (e) { toast(errText(e)); btn.disabled = false; }
  }
  async function replaceExpired(code) {
    const txt = genDate ? 'حتى ' + App.fmtDate(genDate + 'T12:00:00+03:00') : 'بدون انتهاء';
    if (!confirm((code ? 'استبدال هذا الكوبون' : 'استبدال كل الكوبونات المنتهية') + ' بكوبون جديد صالح ' + txt + '؟')) return;
    try {
      const n = await api('admin_replace_expired', { p_campaign: curId, p_expires: endOfDayISO(genDate), p_code: code });
      await loadCamps(); await loadCoupons(); filter = 'avail'; drawCoupons(); toast('تم إصدار ' + n + ' بديل. أرسلها للعملاء من قائمة «متاح»');
    } catch (e) { toast(errText(e)); }
  }
  function phoneFrom(label) {
    const d = String(label || '').replace(/\D/g, '');
    if (/^05\d{8}$/.test(d)) return '966' + d.slice(1);
    if (/^5\d{8}$/.test(d)) return '966' + d;
    if (/^9665\d{8}$/.test(d)) return d;
    return /^\d{10,15}$/.test(d) && !/^0/.test(d) ? d : '';
  }
  function shareWa(k) {
    const t = Object.assign({}, App.DEFAULT_THEME, cur().theme || {});
    const msg = String(t.share_msg || '').replace(/\{brand\}/g, t.brand).replace(/\{offer\}/g, t.offer_title).replace(/\{link\}/g, link(k.code));
    const ph = phoneFrom(k.label);
    window.open('https://wa.me/' + ph + '?text=' + encodeURIComponent(msg), '_blank');
  }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); toast('تم النسخ'); }
    catch (e) { prompt('انسخ الرابط:', text); }
  }
  function download(href, name) { const a = document.createElement('a'); a.href = href; a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
  async function qrPng(code) {
    const t = Object.assign({}, App.DEFAULT_THEME, cur().theme || {});
    const f = '"' + t.font + '", Tajawal, sans-serif';
    try { await document.fonts.load('700 40px ' + f); } catch (e) {}
    const W = 640, H = 800, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const x = cv.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
    const g = x.createLinearGradient(0, 0, W, 0); g.addColorStop(0, t.color); g.addColorStop(1, t.color2);
    x.fillStyle = g; x.fillRect(0, 0, W, 150);
    x.fillStyle = App.onColor(t.color, t.color2); x.textAlign = 'center'; x.direction = 'rtl';
    x.font = '800 40px ' + f; x.fillText(t.brand, W / 2, 68);
    x.font = '500 28px ' + f; x.fillText(t.offer_title, W / 2, 116);
    const qc = document.createElement('canvas');
    await QRCode.toCanvas(qc, link(code) + '&k=1', { width: 440, margin: 1, color: { dark: '#0f172a', light: '#ffffff' } });
    x.drawImage(qc, Math.round((W - qc.width) / 2), 200);
    x.fillStyle = '#0f172a'; x.direction = 'ltr'; x.font = '700 30px ui-monospace, Menlo, monospace'; x.fillText(App.fmtCode(code), W / 2, 700);
    x.fillStyle = '#6b7280'; x.direction = 'rtl'; x.font = '500 24px ' + f; x.fillText('أظهر الكود للكاشير', W / 2, 746);
    return cv.toDataURL('image/png');
  }
  async function downloadOne(k) { download(await qrPng(k.code), 'coupon-' + String(k.n).padStart(3, '0') + '.png'); }
  async function exportZip() {
    const list = filtered(); if (!list.length) return toast('لا توجد كوبونات');
    const btn = $('#zipBtn'); btn.disabled = true;
    const files = [];
    for (let i = 0; i < list.length; i++) {
      btn.textContent = (i + 1) + ' / ' + list.length;
      const url = await qrPng(list[i].code);
      const bin = atob(url.split(',')[1]), data = new Uint8Array(bin.length);
      for (let k = 0; k < bin.length; k++) data[k] = bin.charCodeAt(k);
      files.push({ name: 'coupon-' + String(list[i].n).padStart(3, '0') + '.png', data: data });
    }
    download(URL.createObjectURL(App.makeZip(files)), 'coupons-' + cur().slug + '.zip');
    btn.disabled = false; btn.textContent = 'تنزيل الأكواد (ZIP)';
  }
  function exportCsv() {
    const list = filtered(); if (!list.length) return toast('لا توجد كوبونات');
    const q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
    const ST = { avail: 'available', used: 'used', expired: 'expired', replaced: 'replaced' };
    const rows = [['#', 'code', 'link', 'note', 'status', 'expires_at', 'redeemed_at', 'replaced_by']].concat(list.map(k =>
      [k.n, k.code, link(k.code), k.label || '', ST[stat(k)], k.expires_at || '', k.redeemed_at || '', k.replaced_by || '']));
    const blob = new Blob(['﻿' + rows.map(r => r.map(q).join(',')).join('\n')], { type: 'text/csv;charset=utf-8' });
    download(URL.createObjectURL(blob), 'coupons-' + cur().slug + '.csv');
  }

  /* ----- الإعدادات والتصميم ----- */
  const PRESETS = [['قهوة', '#7c4a21', '#d99a5b'], ['زمردي', '#0f766e', '#5eead4'], ['أزرق', '#1d4ed8', '#60a5fa'],
    ['بنفسجي', '#6d28d9', '#c084fc'], ['أحمر', '#be123c', '#fb7185'], ['برتقالي', '#c2410c', '#fdba74'], ['أسود وذهبي', '#111827', '#d4a017']];
  const EMOJIS = ['☕', '🚗', '🧼', '✨', '🍰', '🥤', '🍔', '🍕', '🎁', '💈', '🧺', '🌟'];
  const fld = (label, inner, hint) => '<label class="f">' + label + '</label>' + inner + (hint ? '<div class="hint">' + hint + '</div>' : '');
  const inp = (k, v, extra) => '<input class="a-in" data-k="' + k + '" value="' + esc(v) + '" ' + (extra || '') + '>';

  function viewSettings() {
    if (!draft) draft = draftFrom(cur());
    const d = draft, t = d.theme, isNew = !d.id;
    $('#view').innerHTML =
      '<div class="edit-grid"><div>' +
      '<div class="card"><h3>' + (isNew ? 'حملة جديدة' : 'إعدادات الحملة') + '</h3>' +
      fld('اسم الحملة (لك فقط)', inp('name', d.name)) +
      '<div class="grid2 keep"><div>' + fld('الحد الأقصى للاستخدام', inp('max', d.max, 'type="number" min="1" inputmode="numeric"'), 'العدد الفعلي المسموح') + '</div>' +
      '<div>' + fld('الرمز السري للكاشير', inp('pin', d.pin, 'inputmode="numeric"'), '6 أرقام أو أكثر أفضل') + '</div></div>' +
      fld('الاسم المختصر (لرابط التقرير)', inp('slug', d.slug, 'dir="ltr" style="text-align:left"'), 'حروف إنجليزية صغيرة وأرقام و - . الصلاحية تحددها عند توليد كل دفعة كوبونات.') +
      '<label class="switch" style="margin-top:16px"><input type="checkbox" data-k="active"' + (d.active ? ' checked' : '') + '> العرض فعّال</label></div>' +

      '<div class="card"><h3>🎨 التصميم</h3>' +
      fld('اسم المحل', inp('theme.brand', t.brand)) +
      fld('الأيقونة', '<div class="chips">' + EMOJIS.map(e => '<button type="button" class="sw emo" data-emo="' + e + '">' + e + '</button>').join('') + '</div>') +
      fld('الشعار (اختياري، يحل محل الأيقونة)', '<div class="row">' + (t.logo ? '<img class="logo-prev" id="lgPrev" src="' + esc(t.logo) + '">' : '') +
        '<input type="file" accept="image/*" id="lgFile" hidden><button type="button" class="a-btn ghost sm" id="lgBtn">رفع صورة</button>' +
        (t.logo ? '<button type="button" class="a-btn ghost sm" id="lgDel">إزالة</button>' : '') + '</div>') +
      fld('عنوان العرض', inp('theme.offer_title', t.offer_title), 'مثال: قهوة مجانية، غسيل سيارة مجاني') +
      fld('وصف قصير', inp('theme.offer_sub', t.offer_sub)) +
      fld('شارة صغيرة أعلى التذكرة', inp('theme.badge', t.badge), 'مثال: هدية، عرض خاص (اتركه فاضي لإخفائها)') +
      fld('النص تحت رمز QR', inp('theme.scan_hint', t.scan_hint), 'مثال: أظهر هذا الكود للكاشير. اتركه فاضي لإخفائه') +
      fld('عبارة الصلاحية', inp('theme.expiry_label', t.expiry_label), 'يظهر بعدها تاريخ انتهاء الكوبون تلقائياً (من صلاحية الدفعة)، مثال: ينتهي بتاريخ') +
      fld('الشروط (سطر لكل شرط)', '<textarea class="a-ta" data-k="theme.terms">' + esc(t.terms) + '</textarea>') +
      fld('الألوان', '<div class="chips">' + PRESETS.map((p, i) => '<button type="button" class="sw" data-pre="' + i + '" title="' + p[0] + '" style="background:linear-gradient(135deg,' + p[1] + ',' + p[2] + ')"></button>').join('') + '</div>') +
      '<div class="grid2 keep" style="margin-top:10px"><div><label class="f">الرئيسي</label><input type="color" data-k="theme.color" value="' + esc(t.color) + '"></div>' +
      '<div><label class="f">الثانوي</label><input type="color" data-k="theme.color2" value="' + esc(t.color2) + '"></div></div>' +
      '<div class="grid2 keep"><div>' + fld('الوضع', '<select class="a-sel" data-k="theme.mode">' + [['light', 'فاتح'], ['dark', 'داكن'], ['auto', 'تلقائي']].map(o => '<option value="' + o[0] + '"' + (t.mode === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select>') + '</div>' +
      '<div>' + fld('الخط', '<select class="a-sel" data-k="theme.font">' + Object.keys(App.FONTS).map(f => '<option' + (t.font === f ? ' selected' : '') + '>' + f + '</option>').join('') + '</select>') + '</div></div>' +
      fld('رسالة الواتساب', '<textarea class="a-ta" data-k="theme.share_msg">' + esc(t.share_msg) + '</textarea>', 'المتغيرات: {brand} اسم المحل · {offer} العرض · {link} رابط الكوبون') +
      '</div>' +

      '<div class="row" style="margin-bottom:24px"><button class="a-btn" id="saveBtn" style="flex:1">' + (isNew ? 'إنشاء الحملة' : 'حفظ التغييرات') + '</button>' +
      (!isNew ? '<button class="a-btn danger" id="delBtn">حذف</button>' : '') + '</div>' +
      '</div>' +

      '<div class="pv-col"><div class="row between" style="margin-bottom:8px"><b>معاينة حيّة</b><div class="chips">' +
      '<button type="button" class="chip" data-pv="valid">صالح</button><button type="button" class="chip" data-pv="redeemed">مستخدم</button></div></div>' +
      '<div class="pv themed" id="pv"><div class="wrap" id="pvIn"></div></div></div></div>';
    bindSettings();
    drawPreview();
  }

  function setPath(path, val) {
    const p = path.split('.'); let o = draft;
    while (p.length > 1) o = o[p.shift()];
    o[p[0]] = val;
  }
  function drawPreview() {
    const pv = $('#pv'); if (!pv || !draft) return;
    const t = App.applyTheme(draft.theme, pv);
    App.renderCoupon($('#pvIn'), {
      status: pvState, theme: draft.theme, code: 'a1b2c3d4e5f60718',
      expires_at: genDate ? genDate + 'T12:00:00+03:00' : riyadhDate(30) + 'T12:00:00+03:00',
      redeemed_at: new Date().toISOString()
    }, { qr: true, qrText: link('a1b2c3d4e5f60718') });
    document.querySelectorAll('[data-pv]').forEach(b => b.classList.toggle('on', b.dataset.pv === pvState));
    document.querySelectorAll('[data-pv]').forEach(b => { b.style.background = b.dataset.pv === pvState ? 'var(--a-pri)' : ''; b.style.color = b.dataset.pv === pvState ? 'var(--a-bg)' : ''; });
  }
  function bindSettings() {
    const v = $('#view');
    v.oninput = v.onchange = e => {
      const el = e.target.closest('[data-k]'); if (!el) return;
      let val = el.type === 'checkbox' ? el.checked : el.value;
      if (el.dataset.k === 'max') val = parseInt(val, 10) || 0;
      setPath(el.dataset.k, val);
      drawPreview();
    };
    v.querySelectorAll('[data-emo]').forEach(b => b.onclick = () => { draft.theme.emoji = b.dataset.emo; draft.theme.logo = ''; viewSettings(); });
    v.querySelectorAll('[data-pre]').forEach(b => b.onclick = () => {
      const p = PRESETS[+b.dataset.pre]; draft.theme.color = p[1]; draft.theme.color2 = p[2]; viewSettings();
    });
    v.querySelectorAll('[data-pv]').forEach(b => b.onclick = () => { pvState = b.dataset.pv; drawPreview(); });
    $('#lgBtn').onclick = () => $('#lgFile').click();
    $('#lgFile').onchange = e => { const f = e.target.files[0]; if (f) resizeLogo(f); };
    const del = $('#lgDel'); if (del) del.onclick = () => { draft.theme.logo = ''; viewSettings(); };
    $('#saveBtn').onclick = save;
    const dl = $('#delBtn'); if (dl) dl.onclick = removeCamp;
  }
  function resizeLogo(file) {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const S = 256, cv = document.createElement('canvas'); cv.width = cv.height = S;
      const x = cv.getContext('2d'); const r = Math.max(S / img.width, S / img.height);
      const w = img.width * r, h = img.height * r;
      x.fillStyle = '#fff'; x.fillRect(0, 0, S, S); x.drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
      draft.theme.logo = cv.toDataURL('image/jpeg', .85); URL.revokeObjectURL(url); viewSettings();
    };
    img.onerror = () => toast('تعذّر قراءة الصورة');
    img.src = url;
  }
  async function save() {
    const d = draft, btn = $('#saveBtn');
    if (!/^[a-z0-9-]{3,40}$/.test(d.slug)) return toast('الاسم المختصر: حروف إنجليزية صغيرة وأرقام و - (3 أحرف فأكثر)');
    if (!d.name.trim()) return toast('اكتب اسم الحملة');
    if (!(d.max > 0)) return toast('الحد الأقصى يجب أن يكون أكبر من صفر');
    if (String(d.pin).length < 4) return toast('الرمز السري 4 أرقام على الأقل');
    btn.disabled = true;
    try {
      const id = await api('admin_save_campaign', {
        p_id: d.id, p_slug: d.slug, p_name: d.name.trim(), p_active: d.active, p_max: d.max, p_pin: String(d.pin),
        p_theme: d.theme });
      await loadCamps(id); draft = draftFrom(cur()); toast('تم الحفظ ✓'); render();
    } catch (e) { toast(errText(e)); btn.disabled = false; }
  }
  async function removeCamp() {
    if (!confirm('حذف الحملة وكل كوبوناتها نهائياً؟ لا يمكن التراجع.')) return;
    try { await api('admin_delete_campaign', { p_id: draft.id }); draft = null; curId = null; await loadCamps(); if (!cur()) startNew(); else tab = 'overview'; render(); toast('تم الحذف'); }
    catch (e) { toast(errText(e)); }
  }

  boot();
})();
</script>
</body>
</html>
