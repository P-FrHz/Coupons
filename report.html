<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>تقرير الاستخدام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css">
<style>
  .big-num{text-align:center;margin:22px 0 6px}
  .big-num b{display:block;font-size:76px;line-height:1;font-weight:800;
    background:linear-gradient(135deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .big-num span{color:var(--muted);font-size:16px}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<div id="toast"></div>
<script src="config.js"></script>
<script src="shared.js"></script>
<script>
(function () {
  const app = document.getElementById('app');
  const slug = (new URLSearchParams(location.search).get('s') || '').trim().toLowerCase();
  let timer = null;
  const ERR = { bad_pin: 'الرمز السري غير صحيح', locked: 'محاولات كثيرة، انتظر 15 دقيقة', invalid: 'رابط التقرير غير صحيح' };

  function login(msg) {
    clearInterval(timer);
    app.innerHTML = '<div class="cashier" style="margin-top:60px"><h3>📊 تقرير الخدمات</h3>' +
      '<p>أدخل الرمز السري للمحل لعرض التقرير.</p>' +
      '<input class="field" id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">' +
      '<button class="btn" id="go">عرض التقرير</button><div class="msg" id="msg">' + App.esc(msg || '') + '</div></div>';
    const pin = document.getElementById('pin');
    try { pin.value = localStorage.getItem('pin:' + slug) || ''; } catch (e) {}
    const go = () => fetchReport(pin.value);
    document.getElementById('go').onclick = go;
    pin.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  }

  async function fetchReport(pin, silent) {
    let r;
    try { r = await App.rpc('report_data', { p_slug: slug, p_pin: pin }); }
    catch (e) { if (!silent) login(e.message === 'not_configured' ? 'الإعدادات غير مكتملة (config.js)' : 'تعذّر الاتصال'); return; }
    if (!r.ok) return login(ERR[r.error] || 'تعذّر عرض التقرير');
    try { localStorage.setItem('pin:' + slug, pin); } catch (e) {}
    draw(r, pin);
  }

  function draw(r, pin) {
    const t = App.applyTheme(r.theme);
    document.title = 'تقرير — ' + t.brand;
    const rows = r.recent.map(x => '<div><b>عميل رقم ' + x.seq + '</b><span>' + App.esc(App.fmtDateTime(x.redeemed_at)) + ' · ' + App.esc(x.code_tail) + '</span></div>').join('');
    app.innerHTML =
      '<div style="text-align:center;margin-top:10px"><div class="logo" style="margin-bottom:8px">' +
      (t.logo ? '<img src="' + App.esc(t.logo) + '" alt="">' : App.esc(t.emoji)) + '</div>' +
      '<h2 style="margin:0">' + App.esc(t.brand) + '</h2><div style="color:var(--muted)">' + App.esc(t.offer_title) + '</div></div>' +
      '<div class="big-num"><b>' + r.served + '</b><span>عميل تمت خدمته</span></div>' +
      '<div class="stats" style="grid-template-columns:1fr"><div class="stat"><b>' + r.today + '</b><small>اليوم</small></div></div>' +
      '<h3 style="margin:22px 4px 0">آخر العمليات</h3>' +
      '<div class="rlist">' + (rows || '<div><span>لا توجد عمليات بعد</span></div>') + '</div>' +
      '<div class="foot">يتحدّث تلقائياً كل 30 ثانية</div>';
    clearInterval(timer);
    timer = setInterval(() => fetchReport(pin, true), 30000);
  }

  if (!slug) { app.innerHTML = '<div class="notice"><div class="big">🔗</div><h2>رابط غير صحيح</h2></div>'; }
  else login();
})();
</script>
</body>
</html>
